# =============================================================================
# Prometheus Configuration (monitoring/prometheus.yml)
# Connects to CodeVideo AI FastAPI Backend /metrics endpoint
# =============================================================================

global:
  scrape_interval: 5s
  evaluation_interval: 5s
  scrape_timeout: 4s

scrape_configs:
  - job_name: "codevideo-fastapi-backend"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["backend:8000", "localhost:8000"]
        labels:
          app: "codevideo-backend"
          service: "fastapi"
          environment: "production"

